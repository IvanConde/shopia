[tool.poetry]
name = "mcp-dominio"
version = "0.1.0"
description = "Servidor MCP que expone las herramientas de dominio (Catálogo y Pedidos) al agente conversacional"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
mcp = "^1.9"
httpx = "^0.27"
starlette = "^0.37"
uvicorn = {extras = ["standard"], version = "^0.32"}
pydantic-settings = "^2.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
