[tool.poetry]
name = "agente"
version = "0.1.0"
description = "Agente conversacional (LangChain ReAct) que orquesta herramientas MCP de dominio"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.32"}
pydantic-settings = "^2.6"
httpx = "^0.27"
redis = "^5.1"
# Núcleo del agente: grafo ReAct + adaptadores MCP + backend Gemini (free tier).
langchain-core = ">=0.3.0"
langgraph = ">=0.3.0"
langchain-mcp-adapters = ">=0.1.0"
langchain-google-genai = ">=2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
