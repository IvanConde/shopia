[tool.poetry]
name = "pedidos"
version = "0.1.0"
description = "Microservicio de Pedidos (checkout, seguimiento, historial)"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.32"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.30"
pydantic = "^2.9"
pydantic-settings = "^2.6"
httpx = "^0.27"
aio-pika = "^9.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
