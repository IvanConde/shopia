[tool.poetry]
name = "auth"
version = "0.1.0"
description = "Servicio de autenticación (emisión y validación de JWT para el gateway)"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.32"}
pydantic = "^2.9"
pydantic-settings = "^2.6"
pyjwt = "^2.9"
httpx = "^0.27"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
