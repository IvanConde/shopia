[tool.poetry]
name = "notificaciones"
version = "0.1.0"
description = "Motor de notificaciones adaptativas (LLM + guardrails; consume pagos.*)"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.32"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.30"
pydantic = "^2.9"
pydantic-settings = "^2.6"
aio-pika = "^9.4"
redis = "^5.1"
httpx = "^0.27"
# Generación del texto con el free tier de Gemini (mismo backend que el agente).
langchain-core = ">=0.3.0"
langchain-google-genai = ">=2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
