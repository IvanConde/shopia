# Plantilla del Secret. NO se aplica directamente ni se commitea con valores reales:
# la clave de Gemini es un secreto y vive solo en infra/.env. El script
# `deploy.sh` crea el Secret real tomando GEMINI_API_KEY de ese .env.
#
# Para crearlo a mano (alternativa al script):
#   kubectl -n pfi create secret generic pfi-secrets \
#     --from-literal=JWT_SECRET=dev-secret-cambiar \
#     --from-literal=GEMINI_API_KEY=<clave-del-.env>
apiVersion: v1
kind: Secret
metadata:
  name: pfi-secrets
  namespace: pfi
type: Opaque
stringData:
  JWT_SECRET: "dev-secret-cambiar"
  GEMINI_API_KEY: "REEMPLAZAR_O_USAR_deploy.sh"
