# Microservicios de dominio: Catálogo, Pedidos, Pagos, Auth, Usuarios, Stock.
# Patrón común: imagen local pfi-<svc>:latest (importada al cluster con k3d image
# import → imagePullPolicy IfNotPresent), envFrom del ConfigMap + Secret (los
# servicios ignoran las variables que no usan), readiness en /health.
# Catálogo lleva más CPU request porque es el objetivo del HPA (ver 60-hpa.yaml).
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: catalogo, namespace: pfi }
spec:
  replicas: 1
  selector: { matchLabels: { app: catalogo } }
  template:
    metadata: { labels: { app: catalogo } }
    spec:
      containers:
        - name: catalogo
          image: pfi-catalogo:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: pfi-config }
            - secretRef: { name: pfi-secrets }
          env:
            - { name: DB_SCHEMA, value: "catalogo" }
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: catalogo, namespace: pfi }
spec:
  selector: { app: catalogo }
  ports: [{ port: 8000, targetPort: 8000 }]
