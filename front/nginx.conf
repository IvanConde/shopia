# El front solo sirve estáticos. Las rutas /api/* nunca llegan acá: Traefik las
# enruta a los servicios (routers de mayor prioridad que el del front).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cacheo de assets con hash en el nombre.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
